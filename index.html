<style>
:root{
  --bg:#FBFBFA; --surface:#FFFFFF; --soft:#F7F6F3; --line:#EAEAEA; --line2:#F1F0EC;
  --ink:#2F3437; --ink2:#111111; --muted:#787774; --faint:#A8A6A1;
  --red:#FDEBEC; --redt:#9F2F2D; --blue:#E1F3FE; --bluet:#1F6C9F;
  --green:#EDF3EC; --greent:#346538; --yellow:#FBF3DB; --yellowt:#956400;
  --gray:#F1F1EF; --grayt:#5F5E5B;
  --serif:"Noto Serif KR", serif; --sans:"Pretendard Variable", Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --mono:"JetBrains Mono", "SF Mono", Consolas, monospace;
  --ease:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 var(--sans);letter-spacing:-.005em;word-break:keep-all;overflow-wrap:anywhere}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(900px 500px at 12% -10%,rgba(214,196,160,.10),transparent 60%),
             radial-gradient(700px 420px at 100% 0%,rgba(160,190,200,.08),transparent 60%)}
a{color:inherit}
button{font:inherit;color:inherit}
.wrap{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:0 24px}

/* header */
header{padding:56px 0 20px}
.eyebrow{font:500 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.lang{float:right;font:600 12px var(--sans);letter-spacing:0;text-transform:none;color:var(--ink2);text-decoration:none;border:1px solid var(--line);border-radius:6px;padding:5px 10px;margin-top:-6px;background:var(--surface)}
.lang:hover{background:var(--soft)}
h1{font:700 40px/1.1 var(--serif);letter-spacing:-.03em;color:var(--ink2);margin:14px 0 10px}
.lede{color:var(--muted);max-width:620px;margin:0}
.bar{position:sticky;top:0;z-index:20;background:rgba(251,251,250,.86);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:6px;min-height:54px;overflow-x:auto;scrollbar-width:none}
.bar .wrap::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:8px 12px;border-radius:6px;color:var(--muted);font-weight:600;white-space:nowrap;cursor:pointer}
.tab:hover{color:var(--ink2);background:var(--soft)}
.tab[aria-selected="true"]{color:var(--ink2);background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.tab .c{font:500 11px var(--mono);color:var(--faint);margin-left:6px}
.bar .sp-switch{margin-left:auto}

.tools{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:22px 0 8px}
.search{flex:1 1 260px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:0 12px;height:40px}
.search input{border:0;outline:0;background:none;flex:1;font:inherit;color:var(--ink2);min-width:0}
.search:focus-within{border-color:#CFCDC7}
.sp-switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none;font-size:13px;color:var(--muted);white-space:nowrap}
.sp-switch input{appearance:none;width:34px;height:20px;border-radius:10px;background:#DCDAD4;position:relative;cursor:pointer;transition:background .2s var(--ease);margin:0}
.sp-switch input::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .25s var(--ease)}
.sp-switch input:checked{background:var(--ink2)}
.sp-switch input:checked::after{transform:translateX(14px)}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:4px 0 2px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:5px 10px;font-size:13px;color:var(--muted);cursor:pointer}
.chip:hover{color:var(--ink2)}
.chip[aria-pressed="true"]{background:var(--ink2);border-color:var(--ink2);color:#fff}
.fsel{height:34px;max-width:100%;border:1px solid var(--line);border-radius:6px;background:var(--surface);font:inherit;font-size:13px;padding:0 10px;color:var(--ink2);cursor:pointer}
.count{font:500 12px var(--mono);color:var(--faint)}
/* 2026-09-27 정렬 */
.meta{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;padding:12px 0 10px}
.sortbar{display:flex;flex-wrap:wrap;align-items:center;gap:4px}
.sortbar .lbl{font-size:12px;color:var(--faint);margin-right:4px}
.sortbar button{border:0;background:none;padding:4px 8px;border-radius:6px;font-size:12.5px;color:var(--muted);cursor:pointer}
.sortbar button:hover{color:var(--ink2);background:var(--soft)}
.sortbar button[aria-pressed="true"]{color:var(--ink2);background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);font-weight:600}

/* grid + cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:12px;padding-bottom:80px}
.grid.wide{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.card{position:relative;display:flex;gap:12px;align-items:center;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;
  transition:box-shadow .2s var(--ease),transform .2s var(--ease);opacity:0;transform:translateY(8px);animation:rise .5s var(--ease) forwards;animation-delay:calc(min(var(--i),24) * 18ms)}
.card:hover{box-shadow:0 2px 10px rgba(0,0,0,.045)}
.card:active{transform:scale(.99)}
@keyframes rise{to{opacity:1;transform:none}}
.ic{flex:0 0 48px;width:48px;height:48px;border-radius:8px;background:var(--soft);display:grid;place-items:center;overflow:hidden;font:700 18px var(--serif);color:var(--faint)}
.ic img{width:100%;height:100%;object-fit:contain}
.card.map{flex-direction:column;align-items:stretch;padding:0;overflow:hidden}
.card.map .thumb{aspect-ratio:16/7;background:var(--soft);overflow:hidden}
.card.map .thumb img{width:100%;height:100%;object-fit:cover;filter:saturate(.85)}
.card.map .body{padding:12px 14px}
.nm{font-weight:650;color:var(--ink2);line-height:1.35;word-break:keep-all}
.sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.tag{display:inline-block;font:600 10.5px/1.5 var(--sans);letter-spacing:.03em;padding:1px 7px;border-radius:9999px;background:var(--gray);color:var(--grayt);white-space:nowrap}
.card .tag,.hero .tag{max-width:100%;white-space:normal;border-radius:6px;text-align:left}   /* 2026-09-27 도시락 효과 · 좋아하는 것처럼 긴 태그는 줄바꿈(말줄임은 차이를 가린다) */
.card>div:not(.ic){max-width:100%}
.hero>div:not(.ic){min-width:0}
.t-불,.t-약점{background:var(--red);color:var(--redt)}
.t-물,.t-흡수{background:var(--blue);color:var(--bluet)}
.t-바람{background:var(--green);color:var(--greent)}
.t-땅,.t-경감,.t-ng{background:var(--yellow);color:var(--yellowt)}
.t-무효{background:var(--gray);color:var(--grayt)}
/* veiled card */
.card.veil .ic img,.card.veil .thumb img{filter:blur(10px) grayscale(.6)}
.card.veil .nm,.card.veil .sub,.card.veil .tags{filter:blur(6px)}
.card.veil::after{content:attr(data-veil);position:absolute;right:10px;top:10px;font:600 10.5px var(--sans);padding:2px 8px;border-radius:9999px;background:var(--ink2);color:#fff}
body.spoil .card.veil .ic img,body.spoil .card.veil .thumb img,body.spoil .card.veil .nm,body.spoil .card.veil .sub,body.spoil .card.veil .tags{filter:none}
body.spoil .card.veil::after{display:none}

/* inline spoilers */
.sp{filter:blur(5px);cursor:pointer;border-radius:3px;background:var(--soft);transition:filter .25s var(--ease)}
.spb{position:relative;filter:blur(6px);cursor:pointer;user-select:none;transition:filter .25s var(--ease)}
.spwrap{position:relative}
.spwrap .hint{position:absolute;inset:0;display:grid;place-items:center;font-size:12.5px;color:var(--ink2);font-weight:600;pointer-events:none}
.sp.shown,.spb.shown,body.spoil .sp,body.spoil .spb{filter:none;cursor:auto;user-select:auto}
.spb.shown+.hint,body.spoil .spb+.hint{display:none}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(17,17,17,.18);opacity:0;pointer-events:none;transition:opacity .25s var(--ease);z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
aside{position:fixed;z-index:50;top:0;right:0;height:100%;width:min(560px,100%);background:var(--surface);border-left:1px solid var(--line);
  transform:translateX(102%);transition:transform .35s var(--ease);overflow-y:auto;overscroll-behavior:contain}
aside.on{transform:none}
.dh{position:sticky;top:0;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:space-between;padding:12px 18px;border-bottom:1px solid var(--line2);z-index:2}
.dh .crumb{font:600 12px var(--sans);color:var(--muted)}
.x{border:1px solid var(--line);background:var(--surface);border-radius:6px;width:32px;height:32px;cursor:pointer;display:grid;place-items:center}
.x:hover{background:var(--soft)}
.db{padding:22px 24px 60px}
.hero{display:flex;gap:16px;align-items:center;margin-bottom:6px}
.hero .ic{flex-basis:72px;width:72px;height:72px;border-radius:10px}
.hero.pc .ic{flex-basis:96px;width:96px;height:96px}
h2{font:700 26px/1.2 var(--serif);letter-spacing:-.02em;color:var(--ink2);margin:0}
.hero .sub{font-size:13.5px}
.banner{margin:-22px -24px 18px;aspect-ratio:16/6;overflow:hidden;background:var(--soft)}
.banner img{width:100%;height:100%;object-fit:cover}
h3{font:650 12.5px/1 var(--sans);letter-spacing:.01em;color:var(--muted);margin:28px 0 10px;padding-bottom:9px;border-bottom:1px solid var(--line2)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:1px;background:var(--line2);border:1px solid var(--line2);border-radius:8px;overflow:hidden;margin-top:16px}
.stats div{background:var(--surface);padding:10px 12px}
.stats b{display:block;font:500 16px var(--mono);color:var(--ink2)}
.stats span{font-size:11.5px;color:var(--muted)}
.prose{white-space:pre-line;color:var(--ink);margin:0}
.muted{color:var(--muted)}
.list{list-style:none;margin:0;padding:0}
.list li{padding:9px 0;border-bottom:1px solid var(--line2);display:flex;gap:10px;align-items:baseline;justify-content:space-between}
.list li:last-child{border-bottom:0}
.list .l{min-width:0}
.list .r{font:500 12.5px var(--sans);font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
a.lk{color:var(--ink2);text-decoration:none;border-bottom:1px solid #D7D5CF;cursor:pointer}
a.lk:hover{border-bottom-color:var(--ink2)}
.skill{padding:12px 0;border-bottom:1px solid var(--line2)}
.skill:last-child{border-bottom:0}
.skill .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.skill .top b{color:var(--ink2)}
.skill .mp{margin-left:auto;font:500 12px var(--mono);color:var(--muted)}
.skill .d{white-space:pre-line;font-size:13.5px;margin-top:4px}
.skill .ev{font-size:12px;color:var(--muted);margin-top:3px}
details.fold{border-bottom:1px solid var(--line2)}
details.fold summary{list-style:none;cursor:pointer;padding:10px 0;display:flex;justify-content:space-between;align-items:center;font-weight:600;color:var(--ink2)}
details.fold summary::-webkit-details-marker{display:none}
details.fold summary::after{content:"+";font:500 16px var(--mono);color:var(--muted)}
details.fold[open] summary::after{content:"−"}
details.fold .in{padding:0 0 12px;font-size:13.5px}
.rs{display:grid;grid-template-columns:repeat(8,1fr);gap:1px;background:var(--line2);border:1px solid var(--line2);border-radius:8px;overflow:hidden;text-align:center;font-size:12px}
.rs>div{padding:8px 2px;background:var(--surface)}
.rs .h{color:var(--muted);font-size:11px;margin-bottom:4px;white-space:nowrap}
.from{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
/* 2026-09-27 항목 링크 = 제자리 펼치기 */
a.lk[aria-expanded="true"]{border-bottom-color:var(--ink2);font-weight:600}
a.lk::after{content:"▾";font-size:10px;color:var(--faint);margin-left:3px;display:inline-block;transition:transform .2s var(--ease)}
a.lk[aria-expanded="true"]::after{transform:rotate(180deg)}
.list li.peek,div.peek{display:block;padding:12px 14px;margin:2px 0 8px;background:var(--soft);border:1px solid var(--line2);border-radius:8px;font-size:13.5px;animation:peek .25s var(--ease)}
.list li.peek{border-bottom:1px solid var(--line2)}
@keyframes peek{from{opacity:0;transform:translateY(-4px)}}
.peek .ph{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.peek .ph .ic{flex-basis:36px;width:36px;height:36px;border-radius:6px;background:var(--surface)}
.peek .ph b{color:var(--ink2);font-size:14px}
.peek .kv{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--muted);margin:4px 0}
.peek .kv b{color:var(--ink2);font:500 12.5px var(--mono)}
.peek .row{margin-top:6px}
.peek .row>span:first-child{color:var(--muted);font-size:12px;margin-right:6px}
.peek .more{margin-top:10px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:4px 10px;font-size:12px;color:var(--muted);cursor:pointer}
.peek .more:hover{color:var(--ink2)}
/* 2026-09-27 보물 = 구역별 */
.grp{font-size:12px;font-weight:650;color:var(--ink2);margin:14px 0 2px}
.grp:first-of-type{margin-top:4px}
.note{font-size:12px;color:var(--faint);margin:-4px 0 6px}
.lap2{display:block;margin-top:3px;font-size:13px}
.empty{padding:60px 0;text-align:center;color:var(--muted)}
footer{border-top:1px solid var(--line);padding:28px 0 48px;color:var(--faint);font-size:12.5px}
.loading{padding:80px 0;text-align:center;color:var(--muted);font:500 12px var(--mono);letter-spacing:.1em}

@media (max-width:760px){
  .wrap{padding:0 16px}
  header{padding:36px 0 12px}
  h1{font-size:30px}
  .grid,.grid.wide{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .card{flex-direction:column;align-items:flex-start;gap:8px;padding:10px}
  .card.map{padding:0}
  aside{top:auto;bottom:0;height:88vh;height:88dvh;width:100%;border-left:0;border-top:1px solid var(--line);border-radius:14px 14px 0 0;transform:translateY(102%)}
  aside.on{transform:none}
  .db{padding:18px 16px calc(60px + env(safe-area-inset-bottom))}
  .banner{margin:-18px -16px 16px}
  .rs{grid-template-columns:repeat(4,1fr);font-size:11.5px}      /* 2026-09-27 360px 에서 「찌르기」가 쪼개져 4칸 × 2줄 */
  .bar .sp-switch span{display:none}
  /* 2026-09-27 모바일 — 탭 줄이 옆으로 더 있음을 흐림으로 알리고, 누르기 쉬운 크기로 */
  .bar .wrap{padding-right:36px;-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 36px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 36px),transparent)}
  .search input,.fsel{font-size:16px}                          /* iOS 는 16px 미만 입력칸을 누르면 확대한다 */
  .chip{padding:7px 11px}
  .sortbar button{padding:6px 9px}
  .list li{padding:11px 0}
}
@media (prefers-reduced-motion:reduce){.card{animation:none;opacity:1;transform:none}aside,.scrim{transition:none}}
</style>
</head>
<body>
<header class="wrap">
  <div class="eyebrow">Another Eden Begins <span style="font-family:var(--sans);letter-spacing:0;text-transform:none">· 비공식 도감</span><a class="lang" href="en/">English</a></div>
  <h1>어나더에덴 비긴즈 도감</h1>
  <p class="lede">동료 · 장비 · 아이템 · 지역 · 적 · 퀘스트 · 배지 · 고양이 · 기억을 게임 화면 기준으로 정리했습니다. 이야기와 관련된 내용은 흐리게 가려 두었습니다. 누르면 하나씩 보이고, 「스포일러 모두 보기」로 한 번에 펼칠 수 있습니다.</p>
</header>
<nav class="bar" aria-label="분류">
  <div class="wrap" id="tabs" role="tablist"></div>
</nav>
<main class="wrap">
  <div class="tools">
    <label class="search"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5" fill="none" stroke="#787774" stroke-width="1.8"/><path d="M11 11l3.5 3.5" stroke="#787774" stroke-width="1.8" stroke-linecap="round"/></svg>
      <input id="q" type="search" placeholder="이름으로 찾기 (한국어 · 일본어)" autocomplete="off" aria-label="검색"></label>
    <label class="sp-switch"><input type="checkbox" id="spoil"><span>스포일러 모두 보기</span></label>
  </div>
  <div id="chips"></div>
  <div class="meta"><span class="count" id="count"></span><div class="sortbar" id="sort"></div></div>
  <div id="grid" class="grid"><div class="loading">불러오는 중</div></div>
</main>
<footer class="wrap">
  비공식 팬 가이드입니다. 게임 정식판(Steam) 데이터를 기준으로 정리했으며, 게임 이미지와 명칭의 권리는 원저작자에게 있습니다.
</footer>
<div class="scrim" id="scrim"></div>
<aside id="detail" aria-hidden="true" aria-label="상세"></aside>

<script>
(() => {
const TABS = [
  {id:"chars", n:"동료"}, {id:"skills", n:"스킬"}, {id:"equip", n:"장비"}, {id:"goods", n:"아이템 · 재료"},
  {id:"maps", n:"지역"}, {id:"enemies", n:"적"}, {id:"quests", n:"퀘스트"},
  {id:"badges", n:"배지"}, {id:"cats", n:"고양이"}, {id:"memories", n:"기억"}];   // 2026-09-27 인게임 도감 분류 중 빠져 있던 셋
const TAB_OF_ITEM = t => (t === "weapon" || t === "armor") ? "equip" : "goods";
const KIND_N = {weapon:"무기", armor:"방어구", lunch:"도시락", item:"아이템", mat:"재료"};
const VEIL_N = {boss:"스포일러 · 보스", ng:"스포일러 · 2회차", secret:"스포일러 · 숨은 제작법", story:"스포일러 · 스토리"};
const RES = ["베기","찌르기","타격","마법","불","땅","바람","물"];
const D = {}, K = {}, BYN = {item:{}, enemy:{}, map:{}, char:{}, quest:{}, badge:{}, cat:{}, memory:{}, skill:{}};
const S = {tab:"chars", f:{}, q:"", spoil:false, seen:new Set(), sort:{}};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num = v => v == null ? "" : Number(v).toLocaleString("ko-KR");
const range = r => !Array.isArray(r) ? num(r) : (r[0] === r[1] ? num(r[0]) : `${num(r[0])}–${num(r[1])}`);
const store = {get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

// 〈장 부제〉 는 인라인 스포일러로
const spText = s => esc(s).replace(/〈([^〉]*)〉/g, '<span class="sp" tabindex="0">〈$1〉</span>');
const spBlock = s => s ? `<div class="spwrap"><p class="prose spb" tabindex="0">${esc(s)}</p><div class="hint">스포일러 — 눌러서 보기</div></div>` : "";
const icon = (i, fb) => i ? `<img src="images/${esc(i)}" alt="" loading="lazy" decoding="async" onerror="this.remove()">` : esc((fb || "?").slice(0,1));
const tag = (t, cls) => `<span class="tag ${cls ? "t-" + cls : ""}">${esc(t)}</span>`;
// 2026-09-27 항목 링크는 누르면 그 자리에서 펼친다(data-p). 가린 항목(r.sp) · veil 지정은 한 겹만 흐리게
const veilSpan = h => `<span class="sp" tabindex="0">${h}</span>`;
function link(name, type, veil){
  const r = (BYN[type] && BYN[type][name]) || (type === "item" ? BYN.badge[name] : null);   // 보물 · 드롭의 배지
  if (!r) return veil ? veilSpan(esc(name)) : esc(name);
  const a = `<a class="lk" data-p="${esc(r.k)}" role="button" tabindex="0" aria-expanded="false">${esc(name)}</a>`;
  return veil || (r.sp && r.sp.length && !S.seen.has(r.k)) ? veilSpan(a) : a;
}
const weak = e => Object.entries(e.rs || {}).filter(([,v]) => v.includes("약점")).map(([k]) => k);
// 2026-10-01 인게임 도감 번호 — no = [번호, 그 탭 전체] = 게임 도감 화면 스크롤 막대의 「n / 전체」(DLC 없는 기준). DLC 항목은 가진 DLC 에 따라 번호가 달라 「DLC」
const noTxt = r => r.no ? `도감 ${r.no[0]}` : r.dlc ? "DLC" : "";
const noFull = r => r.no ? `도감 ${r.no[0]} / ${r.no[1]}` : r.dlc ? "DLC" : "";

async function load(){
  const names = ["chars","items","enemies","maps","quests","badges","cats","memories"];
  const got = await Promise.all(names.map(n => fetch(`data/${n}.json`).then(r => r.json())));
  names.forEach((n, i) => D[n] = got[i]);
  const put = (arr, type) => arr.forEach(r => { r._t = type; K[r.k] = r; if (!BYN[type][r.n]) BYN[type][r.n] = r; });
  put(D.chars, "char"); put(D.items, "item"); put(D.enemies, "enemy"); put(D.maps, "map"); put(D.quests, "quest");
  put(D.badges, "badge"); put(D.cats, "cat"); put(D.memories, "memory");
  D.badges.forEach(r => r.t.forEach(t => { if (!BYN.badge[t.n]) BYN.badge[t.n] = r; }));   // 등급 이름(「…의 증표」)으로도 찾는다
  // 2026-10-03 13:00 스킬 — 동료 스킬(chars.skills) + 배지가 주는 스킬(badges t[].sk)을 모은다(따로 받는 데이터 없음). 이름 · 설명이 같으면 한 장
  const SK = new Map(), used = {};
  const add = (s, own) => { const key = s.n + "\u0001" + s.d; let r = SK.get(key);
    if (!r){ used[s.n] = (used[s.n] || 0) + 1;
      r = {k:"s" + s.n + (used[s.n] > 1 ? "~" + used[s.n] : ""), n:s.n, d:s.d, mp:s.mp, el:s.el, t:s.t, chain:s.chain ?? s.ch, tr:s.tr ?? s.cc, evo:s.evo, pcs:[], bds:[]}; SK.set(key, r); }
    own(r); };
  D.chars.forEach(c => (c.skills || []).forEach(s => add(s, r => { if (!r.pcs.includes(c.n)) r.pcs.push(c.n); })));
  D.badges.forEach(b => b.t.forEach(t => (t.sk || []).forEach(s => add(s, r => { if (!r.bds.includes(b.n)) r.bds.push(b.n); if (b.sp && b.sp.length) r.vsp = b.sp; else r.op = 1; }))));
  D.skills = [...SK.values()];
  D.skills.forEach(r => { r.src = [r.pcs.length ? "동료" : "", r.bds.length ? "배지" : ""].filter(Boolean);
    if (!r.pcs.length && !r.op && r.vsp) r.sp = r.vsp;                    // 가린 배지에서만 나오는 스킬은 같이 가린다
  });
  const share = (a, b) => a.pcs.some(n => b.pcs.includes(n)) || a.bds.some(n => b.bds.includes(n));   // 같은 이름이 여럿이면 주인이 겹치는 쪽
  D.skills.forEach(r => { r.pre = D.skills.filter(x => x.evo === r.n && share(x, r));
    const ev = D.skills.filter(x => x.n === r.evo); r.evoR = ev.find(x => share(x, r)) || ev[0]; });
  put(D.skills, "skill");
}

function rows(tab){
  switch(tab){
    case "chars": return D.chars;
    case "equip": return D.items.filter(i => TAB_OF_ITEM(i.tab) === "equip");
    case "goods": return D.items.filter(i => TAB_OF_ITEM(i.tab) === "goods");
    default: return D[tab];
  }
}
// 탭별 필터 칩 — [이름, 값 뽑기]
const FACETS = {
  chars:   [["무기", r => r.wt]],
  equip:   [["구분", r => KIND_N[r.tab]], ["종류", r => r.g]],
  goods:   [["구분", r => KIND_N[r.tab]], ["종류", r => r.g]],
  enemies: [["분류", r => r.tabn], ["약점", r => weak(r)]],
  quests:  [["종류", r => r.kind]],
  maps:    [],
  badges:  [["도감 탭", r => r.bt], ["분류", r => r.cat]],   // 2026-10-01 첫 칸 = 인게임 도감 하위 탭
  cats:    [["시대", r => r.era], ["거처", r => r.wh]],
  memories:[["종류", r => r.kind], ["묶음", r => r.g]],
  skills:  [["출처", r => r.src], ["속성", r => r.el], ["종류", r => r.t]]};   // 2026-10-03 13:00
function matches(r){
  const q = S.q.trim().toLowerCase();
  if (q && !(`${r.n} ${r.nj || ""}`.toLowerCase().includes(q))) return false;
  const f = S.f[S.tab] || {};
  return (FACETS[S.tab] || []).every(([fn, get]) => {
    const want = f[fn]; if (!want) return true;
    const v = get(r); return Array.isArray(v) ? v.includes(want) : v === want;
  });
}
const veiled = r => r.sp && r.sp.length && !S.spoil && !S.seen.has(r.k);
// 2026-09-27 탭별 정렬 — [이름, 값 뽑기, 처음 누를 때 방향(1 오름 · -1 내림)]. 값이 없는 항목은 방향과 무관하게 뒤로
const lo = v => Array.isArray(v) ? v[0] : v, hi = v => Array.isArray(v) ? v[v.length - 1] : v;
const SORTS = {
  chars:   [["합류 장", r => r.ch, 1], ["이름", r => r.n, 1]],
  equip:   [["공격력 · 방어력", r => r.v, -1], ["이름", r => r.n, 1]],
  goods:   [["이름", r => r.n, 1]],
  maps:    [["적 레벨", r => lo(r.lv), 1], ["이름", r => r.n, 1]],
  enemies: [["레벨", r => lo(r.lv), 1], ["HP", r => hi(r.hp), -1], ["경험치", r => r.exp, -1], ["Git", r => r.gold, -1], ["이름", r => r.n, 1]],
  quests:  [["권장 레벨", r => r.lv, 1], ["이름", r => r.n, 1]],
  badges:  [["적 레벨", r => r.lv, 1], ["이름", r => r.n, 1]],
  cats:    [["이름", r => r.n, 1]],
  memories:[["장 번호", r => r.ch, 1]],
  skills:  [["MP", r => r.mp, 1], ["체인", r => r.chain, 1], ["이름", r => r.n, 1]]};
function sorted(list){
  const st = S.sort[S.tab]; if (!st) return list;
  const [, get] = SORTS[S.tab][st[0]], dir = st[1];
  return list.map((r, i) => [r, get(r), i]).sort((a, b) => {
    const x = a[1], y = b[1], nx = x == null || x === "", ny = y == null || y === "";
    if (nx || ny) return nx - ny || a[2] - b[2];
    const c = typeof x === "string" ? x.localeCompare(y, "ko") : x - y;
    return c * dir || a[2] - b[2];
  }).map(t => t[0]);
}
function renderSort(){
  const st = S.sort[S.tab];
  // 2026-09-27 기본 순서 = 게임 도감 목록 순서(지역 · 퀘스트는 게임 도감이 없어 「기본」)
  $("#sort").innerHTML = `<span class="lbl">정렬</span><button data-s="-1" aria-pressed="${!st}">${S.tab === "maps" || S.tab === "quests" || S.tab === "skills" ? "기본" : "도감 순"}</button>` +
    (SORTS[S.tab] || []).map(([n, , d], i) => { const on = st && st[0] === i; const dir = on ? st[1] : d;
      return `<button data-s="${i}" aria-pressed="${!!on}" title="${dir > 0 ? "낮은 순 · 가나다순" : "높은 순"}">${esc(n)}${on ? (dir > 0 ? " ↑" : " ↓") : ""}</button>`; }).join("");
}

function renderTabs(){
  const q = S.q.trim().toLowerCase();
  $("#tabs").innerHTML = TABS.map(t => {
    const n = rows(t.id).filter(r => !q || `${r.n} ${r.nj || ""}`.toLowerCase().includes(q)).length;
    return `<button class="tab" role="tab" data-tab="${t.id}" aria-selected="${t.id === S.tab}">${t.n}<span class="c">${n}</span></button>`;
  }).join("");
}
function renderChips(){
  const all = rows(S.tab), f = S.f[S.tab] || (S.f[S.tab] = {});
  $("#chips").innerHTML = (FACETS[S.tab] || []).map(([fn, get]) => {
    // 첫 칩이 걸려 있으면 둘째 칩의 선택지는 그 안에서만
    const base = FACETS[S.tab][0][0] === fn ? all : all.filter(r => { const w = f[FACETS[S.tab][0][0]]; if (!w) return true; const v = FACETS[S.tab][0][1](r); return Array.isArray(v) ? v.includes(w) : v === w; });
    const vals = [...new Set(base.flatMap(r => { const v = get(r); return Array.isArray(v) ? v : [v]; }).filter(Boolean))];
    if (fn === "약점") vals.sort((a, b) => RES.indexOf(a) - RES.indexOf(b));
    if (vals.length < 2) return "";
    // 2026-09-27 선택지가 많으면(기억 묶음 · 고양이 거처) 칩 대신 드롭다운 — 모바일 첫 화면을 칩이 덮는다
    if (vals.length > 16) return `<div class="chips" data-f="${esc(fn)}"><select class="fsel" aria-label="${esc(fn)}"><option value="">${esc(fn)} 전체</option>` +
      vals.map(v => `<option value="${esc(v)}"${f[fn] === v ? " selected" : ""}>${esc(v)}</option>`).join("") + `</select></div>`;
    return `<div class="chips" data-f="${esc(fn)}"><button class="chip" aria-pressed="${!f[fn]}" data-v="">${esc(fn)} 전체</button>` +
      vals.map(v => `<button class="chip" aria-pressed="${f[fn] === v}" data-v="${esc(v)}">${esc(v)}</button>`).join("") + "</div>";
  }).join("");
}
function card(r, i){
  const vl = veiled(r) ? ` veil" data-veil="${esc(r.sp[0] === "story" && r.ch ? `스포일러 · 제${r.ch}장` : VEIL_N[r.sp[0]] || "스포일러")}` : "";
  let sub = "", tags = "";
  switch(r._t){
    case "char": sub = [r.job, r.wt].filter(Boolean).join(" · "); if (r.ch) tags = tag(`제${r.ch}장 합류`); break;
    case "item":
      sub = [noTxt(r), KIND_N[r.tab], r.g].filter(Boolean).join(" · ") + (r.v ? ` · ${r.tab === "armor" ? "방어력" : "공격력"} ${num(r.v)}` : "");
      if (r.ab) tags = tag(r.ab); else if (r.fx) tags = tag(r.fx.split("\n")[0]);
      break;
    case "enemy": sub = `${[noTxt(r), esub(r)].filter(Boolean).join(" · ")} · Lv ${range(r.lv)}`; tags = weak(r).map(w => tag(w, "약점")).join(""); break;
    case "quest": sub = [r.where, r.lv ? `Lv ${r.lv}` : ""].filter(Boolean).join(" · "); tags = tag(r.kind); break;
    case "badge": sub = [noTxt(r), r.cat, r.pc].filter(Boolean).join(" · "); tags = tag(r.t[r.t.length - 1].a); break;
    case "cat": sub = [noTxt(r), r.wh, r.area].filter(Boolean).join(" · "); if (r.per) tags = tag(r.per); break;
    case "memory": sub = [r.g, r.wh].filter(Boolean).join(" · "); tags = tag(r.kind); break;
    case "skill": sub = [[...r.pcs, ...r.bds].slice(0, 2).join(", ") + (r.pcs.length + r.bds.length > 2 ? " 외" : ""), r.mp != null ? `MP ${r.mp}` : ""].filter(Boolean).join(" · ");
      tags = (r.el && r.el !== "무" ? tag(r.el, r.el) : "") + (r.t && r.t !== "액티브" ? tag(r.t) : "") + (r.chain ? tag(`체인 ${r.chain}`) : ""); break;
  }
  if (r._t === "map") return `<button class="card map${vl}" style="--i:${i}" data-k="${esc(r.k)}"><div class="thumb">${r.i ? icon(r.i) : ""}</div><div class="body"><div class="nm">${esc(r.n)}</div><div class="sub">Lv ${range(r.lv)}${r.ng ? ` · 뉴 게임+ Lv ${range(r.ng)}` : ""} · 적 ${r.en.length} · 보물 ${r.ch.filter(c => c.o !== "이벤트").length}</div></div></button>`;
  return `<button class="card${vl}" style="--i:${i}" data-k="${esc(r.k)}">${r._t === "quest" ? "" : `<div class="ic">${icon(r.i, r.n)}</div>`}<div style="min-width:0"><div class="nm">${esc(r.n)}</div><div class="sub">${esc(sub)}</div>${tags ? `<div class="tags">${tags}</div>` : ""}</div></button>`;
}
function renderGrid(){
  const list = sorted(rows(S.tab).filter(matches));
  $("#count").textContent = `${list.length.toLocaleString("ko-KR")}개`;
  const g = $("#grid");
  g.className = "grid" + (S.tab === "maps" || S.tab === "quests" ? " wide" : "");
  g.innerHTML = list.length ? list.map(card).join("") : `<div class="empty">조건에 맞는 항목이 없습니다.</div>`;

function render(){ renderTabs(); renderChips(); renderSort(); renderGrid(); }

/* ---------------- 상세 ---------------- */
function srcList(src){
  if (!src || !src.length) return `<p class="muted">알려진 입수처가 없습니다.</p>`;
  return `<ul class="list">${src.map(s => `<li><span class="l">${s[2] === "boss" ? veilSpan(esc(s[1])) : spText(s[1])}</span><span class="r">${esc(s[0])}${s[2] === "ng" ? " " + tag("2회차", "ng") : ""}</span></li>`).join("")}</ul>`;
}
function itemDetail(r){
  const st = [];
  if (r.v) st.push([num(r.v), r.tab === "armor" ? "방어력" : "공격력"]);
  if (r.at) st.push([r.at, "공격 타입"]);
  let h = `<div class="hero"><div class="ic">${icon(r.i, r.n)}</div><div><h2>${esc(r.n)}</h2><div class="sub">${esc([KIND_N[r.tab], r.g, noFull(r)].filter(Boolean).join(" · "))}</div></div></div>`;
  if (st.length) h += `<div class="stats">${st.map(([v, l]) => `<div><b>${esc(v)}</b><span>${l}</span></div>`).join("")}</div>`;
  if (r.ab) h += `<h3>어빌리티</h3><p class="prose"><b>${esc(r.ab)}</b><br>${esc(r.abd || "")}</p>`;
  if (r.fx) h += `<h3>효과</h3><p class="prose">${esc(r.fx)}</p>`;
  if (r.pc) h += `<h3>전용</h3><p class="prose">${link(r.pc, "char")} 전용</p>`;
  if (r.d) h += `<h3>설명</h3><p class="prose">${esc(r.d)}</p>`;
  h += `<h3>입수처</h3>${srcList(r.src)}`;
  if (r.rc){
    const rec = `<ul class="list">${r.rc.map(([mk, n]) => { const m = K[mk]; return `<li><span class="l">${m ? link(m.n, "item") : esc(mk)}</span><span class="r">× ${n}</span></li>`; }).join("")}</ul>`;
    h += `<h3>제작 재료</h3>` + ((r.sp || []).includes("secret") ? `<div class="spwrap"><div class="spb" tabindex="0">${rec}</div><div class="hint">숨은 제작법 — 눌러서 보기</div></div>` : rec);

  if (r.gift) h += `<h3>선물로 주면</h3><ul class="list"><li><span class="l">${r.gift["좋음"].map(n => link(n, "char")).join(", ") || "—"}</span><span class="r">${tag("좋아함", "바람")}</span></li><li><span class="l">${r.gift["나쁨"].map(n => link(n, "char")).join(", ") || "—"}</span><span class="r">${tag("싫어함", "불")}</span></li></ul>`;
  return h;
}
const WP_BEST = {early: "엔딩 전 최선", ending: "엔딩 후 최선", ng: "뉴 게임+ 최선"};

    const first = c.lap2 ? `${tag("2회차~", "ng")} ${link(c.c[0][0], "item", true)}${amt(c.c[0])}` : `${link(c.c[0][0], "item", !!c.sp)}${amt(c.c[0])}`;

  };
  const note = ch.some(c => /\(\d+\/\d+\)/.test(c.a || "")) ? `<p class="note">(1/4) = 이름이 같은 구역 가운데 몇 번째인지 · 대체로 입구 쪽부터</p>` : "";
  return note + groups.map(g => (g.a ? `<div class="grp">${esc(g.a)}</div>` : "") + `<ul class="list">${g.rows.map(row).join("")}</ul>`).join("");

      break;
    case "map":
      sub = `적 레벨 ${range(r.lv)}${r.ng ? ` · 뉴 게임+ 적 레벨 ${range(r.ng)}` : ""}`;   // 2026-10-02 뉴 게임+ 필드 적 레벨
      body = kv([[r.en.length, "적"], [r.ch.filter(c => c.o !== "이벤트").length, "보물"], [r.sh.length, "상점 품목"]]);
      break;
    case "skill":
      sub = [r.t, r.el && r.el !== "무" ? r.el + " 속성" : ""].filter(Boolean).join(" · ");
      body = kv([[r.mp != null ? num(r.mp) : "", "MP"], [r.chain || "", "체인"]]) + row("발동 조건", esc(r.tr || "")) + row("효과", esc(r.d).replace(/\n/g, "<br>")) +
        row("쓰는 동료", r.pcs.map(n => link(n, "char")).join(", ")) + row("배지", r.bds.map(n => link(n, "badge")).join(", "));
      break;
  }
  const ic = r._t === "quest" ? "" : `<div class="ic">${icon(r.i, r.n)}</div>`;
  return `<div class="ph">${ic}<div><b>${esc(r.n)}</b><div class="sub">${esc(sub)}</div></div></div>${body}<button class="more" data-k="${esc(r.k)}">전체 보기 →</button>`;
}
function peek(a){
  const k = a.dataset.p, r = K[k]; if (!r) return;
  const host = a.closest("li, p") || a.parentElement;
  let s = host.nextElementSibling;
  while (s && s.classList.contains("peek")){
    if (s.dataset.for === k){ s.remove(); a.setAttribute("aria-expanded", "false"); return; }
    s = s.nextElementSibling;
  }
  S.seen.add(k);
  const el = document.createElement(host.tagName === "LI" ? "li" : "div");
  el.className = "peek"; el.dataset.for = k; el.innerHTML = mini(r);
  let after = host; while (after.nextElementSibling && after.nextElementSibling.classList.contains("peek")) after = after.nextElementSibling;
  after.after(el);
  a.setAttribute("aria-expanded", "true");
}
const CRUMB = {char:"동료", item:"장비 · 아이템", enemy:"적", map:"지역", quest:"퀘스트", badge:"배지", cat:"고양이", memory:"기억", skill:"스킬"};
function open(k, push){
  const r = K[k]; if (!r) return;
  S.seen.add(k);
  const body = {char:charDetail, item:itemDetail, enemy:enemyDetail, map:mapDetail, quest:questDetail, badge:badgeDetail, cat:catDetail, memory:memoryDetail, skill:skillDetail}[r._t](r);
  const d = $("#detail");
  d.innerHTML = `<div class="dh"><span class="crumb">${CRUMB[r._t]}</span><button class="x" data-close aria-label="닫기"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M1 1l10 10M11 1L1 11" stroke="#2F3437" stroke-width="1.8" stroke-linecap="round"/></svg></button></div><div class="db">${body}</div>`;
  d.classList.add("on"); d.setAttribute("aria-hidden", "false"); d.scrollTop = 0;
  $("#scrim").classList.add("on");
  const tab = r._t === "item" ? TAB_OF_ITEM(r.tab) : {char:"chars", enemy:"enemies", map:"maps", quest:"quests", badge:"badges", cat:"cats", memory:"memories", skill:"skills"}[r._t];
  if (push !== false) history.replaceState(null, "", `#${tab}/${encodeURIComponent(k)}`);
  const c = document.querySelector(`.card[data-k="${CSS.escape(k)}"]`); if (c) c.classList.remove("veil");
}
function close(){
  $("#detail").classList.remove("on"); $("#detail").setAttribute("aria-hidden", "true"); $("#scrim").classList.remove("on");
  history.replaceState(null, "", `#${S.tab}`);
}
function setTab(t){ S.tab = t; window.scrollTo({top:0}); render(); history.replaceState(null, "", `#${t}`); }

/* ---------------- 이벤트 ---------------- */
document.addEventListener("click", e => {
  const t = e.target;
  const sp = t.closest(".sp,.spb"); if (sp && !S.spoil && !sp.classList.contains("shown")){ sp.classList.add("shown"); e.preventDefault(); return; }
  const tb = t.closest(".tab"); if (tb){ setTab(tb.dataset.tab); return; }
  const ch = t.closest(".chip"); if (ch){ const fn = ch.parentElement.dataset.f, f = S.f[S.tab] || (S.f[S.tab] = {}); f[fn] = ch.dataset.v || ""; if (FACETS[S.tab][0][0] === fn) delete f[FACETS[S.tab][1] && FACETS[S.tab][1][0]]; renderChips(); renderGrid(); return; }
  const so = t.closest("[data-s]"); if (so){ const i = +so.dataset.s, st = S.sort[S.tab];   // 같은 기준을 다시 누르면 방향만 뒤집는다
    if (i < 0) delete S.sort[S.tab]; else S.sort[S.tab] = st && st[0] === i ? [i, -st[1]] : [i, SORTS[S.tab][i][2]];
    renderSort(); renderGrid(); return; }
  const pk = t.closest("[data-p]"); if (pk){ e.preventDefault(); peek(pk); return; }
  const lk = t.closest("[data-k]");
  if (lk){
    e.preventDefault();
    // 가린 카드는 첫 번째 누름에 가림만 걷는다 — 두 번째 누름에 연다
    if (lk.classList.contains("veil") && !S.spoil){ S.seen.add(lk.dataset.k); lk.classList.remove("veil"); return; }
    open(lk.dataset.k); return;
  }
  if (t.closest("[data-close]") || t.id === "scrim") close();
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") close();
  if ((e.key === "Enter" || e.key === " ") && e.target.matches(".sp,.spb")) { e.target.classList.add("shown"); e.preventDefault(); }
  else if ((e.key === "Enter" || e.key === " ") && e.target.matches("[data-p]")) { peek(e.target); e.preventDefault(); }
});
let qt; $("#q").addEventListener("input", e => { clearTimeout(qt); qt = setTimeout(() => { S.q = e.target.value; renderTabs(); renderGrid(); }, 120); });
document.addEventListener("change", e => {                          // 2026-09-27 드롭다운 필터
  if (!e.target.matches(".fsel")) return;
  const fn = e.target.parentElement.dataset.f, f = S.f[S.tab] || (S.f[S.tab] = {});
  f[fn] = e.target.value; if (FACETS[S.tab][0][0] === fn) delete f[FACETS[S.tab][1] && FACETS[S.tab][1][0]];
  renderChips(); renderGrid();
});
$("#spoil").addEventListener("change", e => { S.spoil = e.target.checked; document.body.classList.toggle("spoil", S.spoil); store.set("aebg.spoil", S.spoil ? "1" : ""); renderGrid(); });

(async () => {
  S.spoil = store.get("aebg.spoil") === "1"; $("#spoil").checked = S.spoil; document.body.classList.toggle("spoil", S.spoil);
  try { await load(); } catch(err){ $("#grid").innerHTML = `<div class="empty">데이터를 불러오지 못했습니다. 로컬에서 볼 때는 간단한 웹 서버로 여세요.</div>`; return; }
  const [t, k] = decodeURIComponent(location.hash.slice(1)).split("/");
  if (TABS.some(x => x.id === t)) S.tab = t;
  render();
  if (k) open(k, false);
})();
})();
</script>
</body>
